name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Lint, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # @vscode/vsce (used by the "Build VSIX Package" step) requires Node >= 20,
        # so 18.x can't run this job even though lint/type-check/build/test all pass on it.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm run type-check

      - name: Compile Extension (Webpack)
        run: pnpm run compile

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Build VSIX Package
        run: pnpm run vsce-package
